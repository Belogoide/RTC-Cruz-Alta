<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin RTC</title>

<link rel="stylesheet" href="style.css">
<style>
.cardResumo{

background:#f5f5f5;

padding:15px;

border-radius:10px;

flex:1;
min-width:140px;

text-align:center;

font-size:15px;

box-shadow:0 2px 5px rgba(0,0,0,.15);

}
.menu-admin{

display:flex;
gap:15px;
flex-wrap:wrap;
margin-bottom:20px;

}


.menu-admin .botao{

width:200px;
height:55px;
position:relative;
z-index:2;

}



.aba{

position:relative;
width:100%;

}



.aba .botao{

width:100%;
max-width:300px;
margin-top:10px;

}



.lista{

position:relative;
z-index:1;
overflow:hidden;

}


</style>
    
</head>


<body>


<div class="container">


<h1 class="titulo">
🧾 Admin RTC
</h1>



<div class="menu-admin">


<button class="botao" onclick="abrirAba('pagamentos')">

💰 Pagamentos

</button>


<button class="botao" onclick="abrirAba('associados')">

👥 Associados

</button>


<button class="botao" onclick="abrirAba('cobrancas')">

📄 Cobranças

</button>


</div>





<!-- PAGAMENTOS -->


<div id="pagamentos" class="aba" style="display:none;">


<div class="lista">


<h3 style="color:#D61264;">

Pagamentos Pendentes

</h3>


<div id="listaPagamentos">

Carregando pagamentos...

</div>


</div>


</div>







<!-- ASSOCIADOS -->


<div id="associados" class="aba" style="display:none;">

<div class="lista">

<h3 style="color:#D61264;">
👥 Associados
</h3>


<div id="resumoAssociados" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">

<div class="cardResumo">

<b>Total</b><br>

<span id="totalAssociados">0</span>

</div>


<div class="cardResumo">

<b>Ativos</b><br>

<span id="ativosAssociados">0</span>

</div>


<div class="cardResumo">

<b>Afastados</b><br>

<span id="afastadosAssociados">0</span>

</div>


<div class="cardResumo">

<b>Desligados</b><br>

<span id="desligadosAssociados">0</span>

</div>


</div>



<input

id="pesquisaAssociado"

class="input"

placeholder="Pesquisar associado..."

onkeyup="filtrarAssociados()"



>



<br><br>



<button

class="botao"

onclick="abrirNovoAssociado()"

>

➕ Novo Associado

</button>



<div

id="novoAssociado"

style="display:none;margin-top:20px;"

>



<input

id="nomeAssociado"

class="input"

placeholder="Nome"



>

<br><br>



<input

id="emailAssociado"

class="input"

placeholder="Email"



>

<br><br>



<input

id="telefoneAssociado"

class="input"

placeholder="Telefone"



>

<br><br>



<select

id="statusAssociado"

class="input"

>

<option>Ativo</option>

<option>Afastado</option>

<option>Desligado</option>

</select>



<br><br>



<button

class="botao"

onclick="criarAssociadoAdmin()"

>

Salvar

</button>



<button

class="botao"

onclick="cancelarNovoAssociado()"

>

Cancelar

</button>



</div>



<br>


<div id="listaAssociados">

</div>


</div>

</div>


<!-- COBRANCAS -->

















<!-- MODAL EDITAR ASSOCIADO -->

<div id="modalEditar" 
role="dialog"
aria-modal="true"
aria-labelledby="tituloEditarAssociado"
onclick="fecharEdicaoAoClicarFora(event)"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
z-index:999;
align-items:center;
justify-content:center;
">


<div class="lista" 
style="
background:white;
padding:25px;
border-radius:15px;
width:90%;
max-width:400px;
">


<h3 id="tituloEditarAssociado" style="color:#D61264;">
✏️ Editar Associado
</h3>


<input 
id="editarNome"
class="input"
placeholder="Nome">


<br><br>


<input 
id="editarEmail"
class="input"
placeholder="Email"
readonly>


<br><br>


<input 
id="editarTelefone"
class="input"
placeholder="Telefone">


<br><br>


<select 
id="editarStatus"
class="input">

<option>Ativo</option>

<option>Afastado</option>

<option>Desligado</option>

</select>


<br><br>


<div class="modal-acoes">

<button 
id="botaoSalvarEdicao"
class="botao"
onclick="salvarEdicaoAssociado()">

Atualizar

</button>


<button 
class="botao botao-secundario"
onclick="fecharEdicaoAssociado()">

Cancelar

</button>

</div>


</div>


</div>


<div id="cobrancas" class="aba" style="display:none;">


<div class="lista">


<h3 style="color:#D61264;">

Criar Cobrança

</h3>



<div id="selecionarAssociados">

Carregando associados...

</div>



<br>



<input 
id="tipo"
class="input"
placeholder="Tipo (Ex: Evento)">



<br><br>



<input 
id="descricao"
class="input"
placeholder="Descrição">



<br><br>



<input 
id="valor"
class="input"
type="number"
placeholder="Valor">



<br><br>



<button 
class="botao"
onclick="criarCobranca()">

Criar cobrança

</button>



</div>


</div>
<script src="ui.js"></script>
<script>


const API = "https://script.google.com/macros/s/AKfycbzHAwc4EnLQzIsLAmq9dEYhZP5aQE3mPte-PP7E8TKQLF4I6S_fx_mqEHs_aectv1AMfg/exec";



// CONTROLE DAS ABAS

function abrirAba(nome){


document.querySelectorAll(".aba")

.forEach(aba=>{


aba.style.display="none";


});



document.getElementById(nome)

.style.display="block";



if(nome=="pagamentos"){

buscarPagamentos();

}



if(nome=="associados"){

buscarAssociados();

}



if(nome=="cobrancas"){

carregarAssociadosCobranca();

}



}







// =========================
// PAGAMENTOS
// =========================



function buscarPagamentos(){



const area = document.getElementById("listaPagamentos");



area.innerHTML="Carregando...";




fetch(API+"?tipo=pagamentos")

.then(res=>res.json())

.then(dados=>{



area.innerHTML="";



if(dados.length==0){



area.innerHTML=`

<div class="lista">

Nenhum pagamento pendente

</div>

`;

return;


}




dados.forEach(p=>{



area.innerHTML += `


<div class="lista">



<h3 style="color:#D61264;">

Pagamento PIX

</h3>




<p>

<strong>Email:</strong><br>

${p.email}

</p>



<p>

<strong>Itens:</strong><br>

${p.itens}

</p>



<p>

<strong>Valor:</strong><br>

R$ ${Number(p.valor)

.toFixed(2)

.replace(".",",")}

</p>




<p>

<strong>Status:</strong>

${p.status}

</p>



<button

class="botao"

onclick="aprovar(${p.linha})">

✅ Aprovar

</button>



<br><br>



<button

class="botao"

onclick="negar(${p.linha})">

❌ Negar

</button>




</div>



`;



});



})

.catch(erro=>{


console.log(erro);


area.innerHTML="Erro ao carregar pagamentos";


});



}








function aprovar(linha){



fetch(API,{


method:"POST",


body:JSON.stringify({


acao:"aprovar",


linha:linha


})


})



.then(res=>res.json())

.then(retorno=>{


uiAlert(retorno.status);


buscarPagamentos();


});



}








function negar(linha){



fetch(API,{


method:"POST",


body:JSON.stringify({


acao:"negar",


linha:linha


})


})



.then(res=>res.json())

.then(retorno=>{


uiAlert(retorno.status);


buscarPagamentos();


});



}









    // =========================
// ASSOCIADOS
// =========================


function buscarAssociados(){

const area = document.getElementById("listaAssociados");

area.innerHTML="Carregando associados...";

let total=0;
let ativos=0;
let afastados=0;
let desligados=0;



fetch(API+"?tipo=associados")


.then(res=>res.json())


.then(dados=>{



area.innerHTML="";



if(dados.length==0){


area.innerHTML="Nenhum associado encontrado";


return;


}



dados.forEach(a=>{
total++;

if(a.status=="Ativo"){
ativos++;
}

if(a.status=="Afastado"){
afastados++;
}

if(a.status=="Desligado"){
desligados++;
}

area.innerHTML += `

<div class="lista itemAssociado" style="display:flex;align-items:center;gap:15px;">

<button 
class="botao"
style="width:45px;height:45px;"
onclick="editarAssociado('${a.email}')">
✏️
</button>


<div>

<strong>${a.nome}</strong>

<br>

Email:
${a.email}

<br>

Telefone:
${a.telefone}

<br>

Status:
${a.status}

</div>


</div>
`;



});

document.getElementById("totalAssociados").innerHTML = total;
document.getElementById("ativosAssociados").innerHTML = ativos;
document.getElementById("afastadosAssociados").innerHTML = afastados;
document.getElementById("desligadosAssociados").innerHTML = desligados;

})

.catch(erro=>{


console.log(erro);


area.innerHTML="Erro ao carregar associados";


});



}









// =========================
// COBRANÇAS
// =========================



function carregarAssociadosCobranca(){



const area = document.getElementById("selecionarAssociados");



area.innerHTML="Carregando associados...";




fetch(API+"?tipo=associados")


.then(res=>res.json())


.then(dados=>{


area.innerHTML="";



dados.forEach(a=>{



area.innerHTML += `


<div>


<label>


<input

type="checkbox"

class="usuarioCobranca"

value="${a.email}"

>


<strong>

${a.nome}

</strong>


<br>


<small>

${a.email}

</small>


</label>



</div>


<br>


`;



});



})

.catch(erro=>{


console.log(erro);


area.innerHTML="Erro ao carregar associados";


});



}










function criarCobranca(){



let emails=[];




document.querySelectorAll(".usuarioCobranca")


.forEach(item=>{


if(item.checked){


emails.push(item.value);


}


});





if(emails.length==0){


uiAlert("Selecione pelo menos um associado");


return;


}







let dados={


acao:"criarCobranca",


emails:emails,


tipo:document.getElementById("tipo").value,


descricao:document.getElementById("descricao").value,


valor:Number(

document.getElementById("valor").value

)


};






if(

dados.tipo=="" ||

dados.descricao=="" ||

dados.valor<=0

){


uiAlert("Preencha os dados da cobrança");


return;


}






fetch(API,{


method:"POST",


body:JSON.stringify(dados)


})


.then(res=>res.json())


.then(retorno=>{



uiAlert(retorno.status);



// limpa formulário


document.getElementById("tipo").value="";

document.getElementById("descricao").value="";

document.getElementById("valor").value="";



// remove seleção


document.querySelectorAll(".usuarioCobranca")

.forEach(item=>{

item.checked=false;

});



})



.catch(erro=>{


console.log(erro);


uiAlert("Erro ao criar cobrança");


});



}
   
function criarAssociadoAdmin(){


let dados = {


acao:"criarAssociado",


nome:
document.getElementById("nomeAssociado").value,


email:
document.getElementById("emailAssociado").value,


telefone:
document.getElementById("telefoneAssociado").value,


status:
document.getElementById("statusAssociado").value


};



if(
dados.nome=="" ||
dados.email==""
){

uiAlert("Nome e email são obrigatórios");

return;

}



fetch(API,{

method:"POST",

body:JSON.stringify(dados)

})


.then(res=>res.json())


.then(retorno=>{


uiAlert(retorno.status);


buscarAssociados();


document.getElementById("nomeAssociado").value="";
document.getElementById("emailAssociado").value="";
document.getElementById("telefoneAssociado").value="";
document.getElementById("statusAssociado").value="Ativo";


})


.catch(erro=>{


console.log(erro);

uiAlert("Erro ao criar associado");


});


}

function abrirNovoAssociado(){

document.getElementById("novoAssociado").style.display="block";

}



function cancelarNovoAssociado(){

document.getElementById("novoAssociado").style.display="none";

}

   function filtrarAssociados(){

let texto = document.getElementById("pesquisaAssociado").value.trim().toLowerCase();

document.querySelectorAll(".itemAssociado").forEach(card=>{

let conteudo = card.innerText.toLowerCase();
card.style.display = conteudo.includes(texto) ? "flex" : "none";

});

}

  async function editarAssociado(email){

try {

const resposta = await fetch(API+"?tipo=associados");
if(!resposta.ok) throw new Error("Não foi possível carregar os associados.");

const dados = await resposta.json();
const associado = dados.find(a => String(a.email).toLowerCase() === String(email).toLowerCase());

if(!associado){
uiAlert("Associado não encontrado.");
return;
}

document.getElementById("editarNome").value = associado.nome || "";
document.getElementById("editarEmail").value = associado.email || "";
document.getElementById("editarTelefone").value = associado.telefone || "";
document.getElementById("editarStatus").value = associado.status || "Ativo";
document.getElementById("modalEditar").style.display="flex";
document.getElementById("editarNome").focus();

} catch(erro) {
console.error("Erro ao carregar associado:", erro);
uiAlert("Não foi possível carregar os dados do associado. Tente novamente.");
}

}

    function fecharEdicaoAssociado(){

document.getElementById("modalEditar").style.display="none";
document.getElementById("botaoSalvarEdicao").disabled=false;
document.getElementById("botaoSalvarEdicao").textContent="Atualizar";

}

function fecharEdicaoAoClicarFora(event){
if(event.target.id === "modalEditar") fecharEdicaoAssociado();
}

document.addEventListener("keydown", event => {
if(event.key === "Escape" && document.getElementById("modalEditar").style.display === "flex"){
fecharEdicaoAssociado();
}
});




async function salvarEdicaoAssociado(){

const botao = document.getElementById("botaoSalvarEdicao");
const dados={
acao:"editarAssociado",
nome:document.getElementById("editarNome").value.trim(),
email:document.getElementById("editarEmail").value.trim(),
telefone:document.getElementById("editarTelefone").value.trim(),
status:document.getElementById("editarStatus").value
};

if(!dados.nome){
uiAlert("Informe o nome do associado.");
document.getElementById("editarNome").focus();
return;
}

if(!dados.email){
uiAlert("O associado não possui um e-mail identificado. Feche o modal e carregue os dados novamente.");
return;
}

botao.disabled = true;
botao.textContent = "Atualizando...";

try {
const resposta = await fetch(API,{
method:"POST",
body:JSON.stringify(dados)
});
if(!resposta.ok) throw new Error("Falha na comunicação com a API.");
const retorno = await resposta.json();
uiAlert(retorno.status || "Associado atualizado com sucesso.");
fecharEdicaoAssociado();
buscarAssociados();
} catch(erro) {
console.error("Erro ao editar associado:", erro);
uiAlert("Não foi possível atualizar o associado. Tente novamente.");
botao.disabled = false;
botao.textContent = "Atualizar";
}
}

    
</script>


</div>


</body>

</html>
